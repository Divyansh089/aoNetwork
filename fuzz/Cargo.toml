[package]
name = "ao_network-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ao_network]
path = ".."

[workspace]
members = ["."]

[[bin]]
name = "beacon_decode"
path = "fuzz_targets/beacon_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reassembler_push"
path = "fuzz_targets/reassembler_push.rs"
test = false
doc = false
bench = false
